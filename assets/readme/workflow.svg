<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How a Harness Reins callback works</title>
<desc id="d">Five steps: submit, own, run, queue, resume; a loop returns from resume to submit for the next stage.</desc>
<rect x="0.5" y="0.5" width="1199" height="349" rx="14" fill="#ffffff" stroke="#d8dee4"/>
<text x="40" y="56" font-size="13" font-weight="600" letter-spacing="1.6" fill="#2a78d6">HOW A CALLBACK WORKS</text>
<text x="40" y="76" font-size="13" fill="#818b98">Codex resumes with codex exec resume · Claude Code with a background reins wait · Pi through its extension</text>
<rect x="40" y="92" width="204" height="182" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="58" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2a78d6">01</text>
<text x="86" y="124" font-size="16" font-weight="650" fill="#1f2328">Submit</text>
<text x="58" y="156" font-size="13.5" fill="#59636e">The agent calls reins run</text>
<text x="58" y="177" font-size="13.5" fill="#59636e">or reins agent; the task</text>
<text x="58" y="198" font-size="13.5" fill="#59636e">is durable before it</text>
<text x="58" y="219" font-size="13.5" fill="#59636e">returns.</text>
<text x="58" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#818b98">session bound</text>
<path d="M248,183 L264,183" stroke="#818b98" stroke-width="1.5"/>
<path d="M263,178 L269,183 L263,188 Z" fill="#818b98"/>
<rect x="269" y="92" width="204" height="182" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="287" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2a78d6">02</text>
<text x="315" y="124" font-size="16" font-weight="650" fill="#1f2328">Own</text>
<text x="287" y="156" font-size="13.5" fill="#59636e">The OS starts a separate</text>
<text x="287" y="177" font-size="13.5" fill="#59636e">task service, not a child</text>
<text x="287" y="198" font-size="13.5" fill="#59636e">of the agent or the</text>
<text x="287" y="219" font-size="13.5" fill="#59636e">daemon.</text>
<text x="287" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#818b98">systemd · launchd · schtasks</text>
<path d="M477,183 L493,183" stroke="#818b98" stroke-width="1.5"/>
<path d="M492,178 L498,183 L492,188 Z" fill="#818b98"/>
<rect x="498" y="92" width="204" height="182" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="516" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2a78d6">03</text>
<text x="544" y="124" font-size="16" font-weight="650" fill="#1f2328">Run</text>
<text x="516" y="156" font-size="13.5" fill="#59636e">The job runs for minutes</text>
<text x="516" y="177" font-size="13.5" fill="#59636e">or days. The agent has</text>
<text x="516" y="198" font-size="13.5" fill="#59636e">ended its turn; nothing</text>
<text x="516" y="219" font-size="13.5" fill="#59636e">polls.</text>
<text x="516" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#818b98">no model calls</text>
<path d="M706,183 L722,183" stroke="#818b98" stroke-width="1.5"/>
<path d="M721,178 L727,183 L721,188 Z" fill="#818b98"/>
<rect x="727" y="92" width="204" height="182" rx="10" fill="#f6f8fa" stroke="#d8dee4"/>
<text x="745" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2a78d6">04</text>
<text x="773" y="124" font-size="16" font-weight="650" fill="#1f2328">Queue</text>
<text x="745" y="156" font-size="13.5" fill="#59636e">On exit, Reins stores the</text>
<text x="745" y="177" font-size="13.5" fill="#59636e">result and queues one</text>
<text x="745" y="198" font-size="13.5" fill="#59636e">callback for that</text>
<text x="745" y="219" font-size="13.5" fill="#59636e">session.</text>
<text x="745" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#818b98">at-least-once</text>
<path d="M935,183 L951,183" stroke="#818b98" stroke-width="1.5"/>
<path d="M950,178 L956,183 L950,188 Z" fill="#818b98"/>
<rect x="956" y="92" width="204" height="182" rx="10" fill="#ddf4ff" stroke="#2a78d6"/>
<text x="974" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#2a78d6">05</text>
<text x="1002" y="124" font-size="16" font-weight="650" fill="#1f2328">Resume</text>
<text x="974" y="156" font-size="13.5" fill="#59636e">The same session wakes,</text>
<text x="974" y="177" font-size="13.5" fill="#59636e">inspects the result and</text>
<text x="974" y="198" font-size="13.5" fill="#59636e">runs reins ack.</text>
<text x="974" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#818b98">explicit ACK</text>
<path d="M1058.0,274 L1058.0,314 L142.0,314 L142.0,282" fill="none" stroke="#818b98" stroke-width="1.5"/>
<path d="M137.0,288 L142.0,281 L147.0,288 Z" fill="#818b98"/>
<rect x="362.0" y="303" width="476" height="22" fill="#ffffff"/>
<text x="600.0" y="319" font-size="13" fill="#59636e" text-anchor="middle">more to do? the agent submits the next stage and the loop repeats</text>
</svg>
