<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How a Harness Reins callback works</title>
<desc id="d">Five steps: submit, own, run, queue, resume; a loop returns from resume to submit for the next stage.</desc>
<rect x="0.5" y="0.5" width="1199" height="349" rx="14" fill="#0d1117" stroke="#30363d"/>
<text x="40" y="56" font-size="13" font-weight="600" letter-spacing="1.6" fill="#3987e5">一次回调怎么走完</text>
<text x="40" y="76" font-size="13" fill="#8b949e">Codex 通过 codex exec resume 恢复 · Claude Code 通过后台 reins wait · Pi 通过扩展</text>
<rect x="40" y="92" width="204" height="182" rx="10" fill="#151b23" stroke="#30363d"/>
<text x="58" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3987e5">01</text>
<text x="86" y="124" font-size="16" font-weight="650" fill="#f0f6fc">提交</text>
<text x="58" y="156" font-size="13.5" fill="#c3cbd4">Agent 调用 reins run 或</text>
<text x="58" y="177" font-size="13.5" fill="#c3cbd4">reins agent，返回之前任</text>
<text x="58" y="198" font-size="13.5" fill="#c3cbd4">务已经落盘。</text>
<text x="58" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e">绑定原会话</text>
<path d="M248,183 L264,183" stroke="#8b949e" stroke-width="1.5"/>
<path d="M263,178 L269,183 L263,188 Z" fill="#8b949e"/>
<rect x="269" y="92" width="204" height="182" rx="10" fill="#151b23" stroke="#30363d"/>
<text x="287" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3987e5">02</text>
<text x="315" y="124" font-size="16" font-weight="650" fill="#f0f6fc">托管</text>
<text x="287" y="156" font-size="13.5" fill="#c3cbd4">由操作系统启动独立的任务</text>
<text x="287" y="177" font-size="13.5" fill="#c3cbd4">服务，不是 Agent 或守护</text>
<text x="287" y="198" font-size="13.5" fill="#c3cbd4">进程的子进程。</text>
<text x="287" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e">系统原生托管</text>
<path d="M477,183 L493,183" stroke="#8b949e" stroke-width="1.5"/>
<path d="M492,178 L498,183 L492,188 Z" fill="#8b949e"/>
<rect x="498" y="92" width="204" height="182" rx="10" fill="#151b23" stroke="#30363d"/>
<text x="516" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3987e5">03</text>
<text x="544" y="124" font-size="16" font-weight="650" fill="#f0f6fc">运行</text>
<text x="516" y="156" font-size="13.5" fill="#c3cbd4">任务跑几分钟到几天。</text>
<text x="516" y="177" font-size="13.5" fill="#c3cbd4">Agent 已结束回合，没有任</text>
<text x="516" y="198" font-size="13.5" fill="#c3cbd4">何轮询。</text>
<text x="516" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e">零模型调用</text>
<path d="M706,183 L722,183" stroke="#8b949e" stroke-width="1.5"/>
<path d="M721,178 L727,183 L721,188 Z" fill="#8b949e"/>
<rect x="727" y="92" width="204" height="182" rx="10" fill="#151b23" stroke="#30363d"/>
<text x="745" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3987e5">04</text>
<text x="773" y="124" font-size="16" font-weight="650" fill="#f0f6fc">排队</text>
<text x="745" y="156" font-size="13.5" fill="#c3cbd4">任务退出后，Reins 保存结</text>
<text x="745" y="177" font-size="13.5" fill="#c3cbd4">果，为那个会话排入一条回</text>
<text x="745" y="198" font-size="13.5" fill="#c3cbd4">调。</text>
<text x="745" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e">至少投递一次</text>
<path d="M935,183 L951,183" stroke="#8b949e" stroke-width="1.5"/>
<path d="M950,178 L956,183 L950,188 Z" fill="#8b949e"/>
<rect x="956" y="92" width="204" height="182" rx="10" fill="#0c2d4f" stroke="#3987e5"/>
<text x="974" y="124" font-size="12" font-weight="600" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#3987e5">05</text>
<text x="1002" y="124" font-size="16" font-weight="650" fill="#f0f6fc">恢复</text>
<text x="974" y="156" font-size="13.5" fill="#c3cbd4">同一个会话醒来，检查结果，</text>
<text x="974" y="177" font-size="13.5" fill="#c3cbd4">执行 reins ack。</text>
<text x="974" y="256" font-size="11.5" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" fill="#8b949e">显式 ACK</text>
<path d="M1058.0,274 L1058.0,314 L142.0,314 L142.0,282" fill="none" stroke="#8b949e" stroke-width="1.5"/>
<path d="M137.0,288 L142.0,281 L147.0,288 Z" fill="#8b949e"/>
<rect x="460.6" y="303" width="278.9" height="22" fill="#0d1117"/>
<text x="600.0" y="319" font-size="13" fill="#c3cbd4" text-anchor="middle">还有下一步？Agent 再提交一次，循环继续</text>
</svg>
