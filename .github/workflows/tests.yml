name: Linux, macOS and Windows tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install Linux task owner
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y screen
      - name: Install package
        run: python -m pip install .
      - name: Unit and local process tests
        env:
          CODEX_HOME: ${{ runner.temp }}/reins-test-profile
          REINS_HOME: ${{ runner.temp }}/reins-test-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/reins-claude-profile
          REINS_TARGET_LOCK_DIR: ${{ runner.temp }}/reins-test-locks
        run: python -m unittest discover -s tests -q
      - name: Installed CLI and skill resources
        run: |
          reins --version
          reins run --agent codex --session ci-preview --backend auto --dry-run -- echo preview
          python -c "from importlib.resources import files; assert files('harness_reins').joinpath('assets/skills/reference/SKILL.md').is_file()"
      - name: Native macOS task and coordinator lifecycle
        if: runner.os == 'macOS'
        env:
          REINS_TEST_LAUNCHD: '1'
          REINS_TEST_SCREEN: '1'
          CODEX_HOME: ${{ runner.temp }}/reins-test-profile
          REINS_HOME: ${{ runner.temp }}/reins-test-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/reins-claude-profile
          REINS_TARGET_LOCK_DIR: ${{ runner.temp }}/reins-test-locks
          TMPDIR: /tmp
        run: |
          python -m unittest discover -s tests -p test_launchd_integration.py -v
          python -m unittest discover -s tests -p test_screen_integration.py -v

      - name: Native Linux task and coordinator lifecycle
        if: runner.os == 'Linux'
        env:
          REINS_TEST_SYSTEMD: '1'
          REINS_TEST_SCREEN: '1'
          CODEX_HOME: ${{ runner.temp }}/reins-test-profile
          REINS_HOME: ${{ runner.temp }}/reins-test-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/reins-claude-profile
          REINS_TARGET_LOCK_DIR: ${{ runner.temp }}/reins-test-locks
        run: |
          export XDG_RUNTIME_DIR="/run/user/$(id -u)"
          export DBUS_SESSION_BUS_ADDRESS="unix:path=$XDG_RUNTIME_DIR/bus"
          sudo systemctl start "user@$(id -u).service"
          python -c "from harness_reins.owners import SystemdUserBackend; assert SystemdUserBackend().available(), 'systemd user manager required'"
          python -m unittest discover -s tests -p test_systemd_integration.py -v
          python -m unittest discover -s tests -p test_screen_integration.py -v

      - name: Native Windows Task Scheduler ownership
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REINS_TEST_WINDOWS_SCHEDULER: '1'
          CODEX_HOME: ${{ runner.temp }}/reins-windows-profile
          REINS_HOME: ${{ runner.temp }}/reins-windows-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/reins-windows-claude-profile
          REINS_TARGET_LOCK_DIR: ${{ runner.temp }}/reins-windows-locks
          PYTHONIOENCODING: utf-8
        run: |
          # Use the runner's own user session, without alternate credentials.
          whoami
          Get-Service Schedule
          python -m unittest discover -s tests -p test_windows_backend.py -v
          exit $LASTEXITCODE
      - name: Native Windows task and coordinator lifecycle
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          REINS_TEST_WINDOWS_TASK: '1'
          CODEX_HOME: ${{ runner.temp }}/reins-windows-profile
          REINS_HOME: ${{ runner.temp }}/reins-windows-home
          CLAUDE_CONFIG_DIR: ${{ runner.temp }}/reins-windows-claude-profile
          REINS_TARGET_LOCK_DIR: ${{ runner.temp }}/reins-windows-locks
          PYTHONIOENCODING: utf-8
        run: |
          python -m unittest discover -s tests -p test_windows_integration.py -v
          exit $LASTEXITCODE

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root container
        run: docker build -f examples/docker/Dockerfile -t reins:ci .
      - name: Container task lifetime and configuration repair
        run: |
          docker run --rm --init --network none \
            -v "${PWD}/tests:/tests:ro" -e REINS_TEST_SCREEN=1 -e REINS_TEST_DIAGNOSTICS=1 \
            reins:ci python -m unittest discover -s /tests -p 'test_*integration.py' -v
