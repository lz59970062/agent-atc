[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harness-reins"
version = "0.9.0"
description = "Harness Reins: a harness for your harnesses. Dispatch work to Codex, Claude Code or Pi and route the result back to the session that asked."
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Local" }
]
keywords = ["agents", "harness", "codex", "claude-code", "pi", "callback", "long-running-tasks"]
classifiers = [
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS :: MacOS X",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/lz59970062/harness-reins"
Repository = "https://github.com/lz59970062/harness-reins"
Changelog = "https://github.com/lz59970062/harness-reins/blob/main/CHANGELOG.md"
Issues = "https://github.com/lz59970062/harness-reins/issues"

[project.scripts]
reins = "harness_reins.cli:main"
reins-desktop-core = "harness_reins.harness.codex.desktop.core:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
harness_reins = ["_build.txt", "assets/skills/reference/SKILL.md", "assets/skills/claude/SKILL.md", "assets/skills/codex/SKILL.md", "assets/skills/pi/SKILL.md", "assets/skills/reference/agents/openai.yaml", "templates/*.md", "owners/*.ps1", "harness/codex/desktop/windows_assets/*.ps1", "harness/codex/desktop/windows_assets/*.py", "harness/pi/extension/*.js"]
